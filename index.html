<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界规则修改器 · 一屏一章</title>
<meta name="description" content="选一条现实规则，调四个参数，设三个世界假设，生成一条从原始到现代的分版长河：一屏一章，只看被改写的大事，点卡片看细节。AI 走站点公共代理，访客免填 Key，也可写自定义规则、指定干预时间。情景推演，不是史实。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css?v=2.4.0">
<script defer src="world-rule/data.js?v=2.4.0"></script>
<script defer src="world-rule/engine.js?v=2.4.0"></script>
<script defer src="chapters.js?v=2.4.0"></script>
<script defer src="version.js?v=2.4.0"></script>
<script defer src="ai.js?v=2.4.0"></script>
<script defer src="setup.js?v=2.4.0"></script>
<script defer src="chapter.js?v=2.4.0"></script>
<script defer src="app.js?v=2.4.0"></script>
</head>
<body>

<header class="masthead">
  <div class="issue mono">号外 · 情景推演，不是史实</div>
  <div class="brand">
    <h1>世界规则修改器</h1>
    <div class="latin mono">World Rule Modifier · 一屏一章</div>
  </div>
</header>

<main>

  <section id="setup" class="setup" aria-labelledby="setupTitle">
    <div class="setup-tools">
      <span id="apiPill" class="api-pill mono">公共 AI 代理 · 检测中…</span>
      <span class="note proxy-note">AI 由站点公共代理提供，访客免填 Key；代理不可用时内置规则仍可走本地模板。</span>
    </div>
    <p id="setupVersion" class="setup-ver mono" aria-live="polite"></p>
    <h2 id="setupTitle" class="page-title" tabindex="-1">设定这个世界</h2>

    <div class="setup-block">
      <h3 class="block-head">选一条要改的规则</h3>
      <div id="ruleCards" class="rule-cards" role="group" aria-label="选择规则"></div>
    </div>

    <div id="customDesk" class="setup-block" hidden>
      <h3 class="block-head">自定义规则</h3>
      <div class="api-field">
        <label class="api-label mono" for="customName">名称（≤20 字）</label>
        <input id="customName" class="api-input" type="text" maxlength="20" placeholder="例：取消大学考试">
      </div>
      <div class="api-field">
        <label class="api-label mono" for="customDesc">一句话描述（≤120 字）</label>
        <input id="customDesc" class="api-input" type="text" maxlength="120" placeholder="例：文凭不再存在，本事靠跟着做学会">
      </div>
      <p class="note">四个参数都要起名，AI 按开关状态推演。</p>
      <div id="customParams" class="custom-params" role="group" aria-label="自定义参数"></div>
    </div>

    <div id="paramBlock" class="setup-block">
      <h3 class="block-head">四个参数</h3>
      <p id="paramNote" class="note"></p>
      <div id="paramToggles" class="switch-list" role="group" aria-label="规则参数"></div>
    </div>

    <div class="setup-block">
      <h3 class="block-head">更改时间</h3>
      <div id="eraBtns" class="era-btns" role="group" aria-label="干预时代"></div>
      <div class="api-field era-year">
        <label class="api-label mono" for="yearInput">年份（可选，留空用时代起点）</label>
        <input id="yearInput" class="api-input" type="text" maxlength="8" placeholder="例：1450">
      </div>
      <p id="interventionNote" class="note"></p>
    </div>

    <div class="setup-block">
      <h3 class="block-head">三个世界假设</h3>
      <div id="assumeToggles" class="switch-list" role="group" aria-label="世界假设"></div>
      <p class="note">假设决定规则能改到长河的哪一段；关掉一条，对应的改写会落空。</p>
    </div>

    <button id="aiGenerateBtn" class="generate" type="button">用 AI 生成这个世界 →</button>
    <button id="localBtn" class="generate generate-local" type="button">本地模板</button>
    <p id="genNote" class="note gen-note" aria-live="polite"></p>
    <button id="fallbackBtn" class="line-btn fallback-btn" type="button" hidden>改用内置规则</button>
    <p id="appError" class="error" role="alert" hidden></p>
  </section>

  <section id="chapter" class="chapter" aria-labelledby="chapterName" hidden>
    <div class="chapter-top">
      <span id="chapterRun" class="chapter-run mono"></span>
      <span id="chapterNo" class="chapter-no mono"></span>
      <span id="chapterSource" class="chapter-source mono"></span>
      <button id="regenBtn" class="line-btn" type="button" hidden>重新生成</button>
      <button id="editAssumptions" class="line-btn" type="button">修改假设</button>
    </div>

    <div class="chapter-main">
      <div class="chapter-title">
        <div id="chapterBig" class="chapter-bignum" aria-hidden="true">01</div>
        <div class="chapter-headtext">
          <h2 id="chapterName" class="chapter-name" tabindex="-1"></h2>
          <p id="chapterSubtitle" class="chapter-subtitle"></p>
          <p id="chapterSpan" class="chapter-span mono"></p>
          <p id="chapterCount" class="chapter-count mono"></p>
          <p id="chapterIntervention" class="chapter-intervention mono" hidden></p>
          <p id="chapterRecap" class="chapter-recap" hidden></p>
          <p id="chapterPersonal" class="chapter-personal" hidden></p>
        </div>
      </div>

      <div id="chapterBody" class="chapter-cards" data-count="0"></div>
    </div>

    <nav class="chapter-nav" aria-label="章节导航">
      <button id="prevChapter" class="nav-btn" type="button">← 上一版</button>
      <div id="chapterDots" class="chapter-dots" role="group" aria-label="章节圆点"></div>
      <button id="nextChapter" class="nav-btn" type="button">下一版 →</button>
    </nav>
  </section>

</main>

<div class="rift" aria-hidden="true"></div>

<div id="evOverlay" class="overlay" hidden>
  <div class="overlay-backdrop" data-close="1"></div>
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <button id="ovClose" class="ov-close" type="button" aria-label="关闭">×</button>
    <p id="ovMeta" class="ov-meta mono"></p>
    <h3 id="ovTitle" class="ov-title"></h3>
    <p id="ovFiction" class="ov-fiction mono" hidden>代号人物 · 虚构改写，勿对号入座</p>
    <p id="ovDetail" class="ov-detail"></p>
    <div class="ov-why">
      <span class="ov-label mono">为什么</span>
      <p id="ovWhy"></p>
    </div>
    <div id="ovChainBlock" class="ov-chain">
      <span class="ov-label mono">连锁反应</span>
      <p id="ovChain"></p>
    </div>
  </div>
</div>

<footer>
  <p id="disclaimer" class="disclaimer"></p>
  <p class="colophon mono"><span id="metaVersion"></span> · 报纸版式 B · 断网可玩</p>
</footer>

<noscript><p class="error">本页需要 JavaScript 才能推演世界。请启用后刷新。</p></noscript>

</body>
</html>
