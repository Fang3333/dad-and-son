<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界规则修改器 · 分版长河</title>
<meta name="description" content="选一条现实规则，调四个参数，设三个世界假设，生成一条从原始到现代的分版长河：五个版逐页翻，每件大事对照原来与现在。情景推演，不是史实。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css?v=2.1.0">
<script defer src="world-rule/data.js?v=2.1.0"></script>
<script defer src="world-rule/engine.js?v=2.1.0"></script>
<script defer src="chapters.js?v=2.1.0"></script>
<script defer src="version.js?v=2.1.0"></script>
<script defer src="setup.js?v=2.1.0"></script>
<script defer src="chapter.js?v=2.1.0"></script>
<script defer src="app.js?v=2.1.0"></script>
</head>
<body>

<header class="masthead">
  <div class="issue mono">号外 · 情景推演，不是史实</div>
  <div class="brand">
    <h1>世界规则修改器</h1>
    <div class="latin mono">World Rule Modifier · 分版长河</div>
  </div>
</header>

<main>

  <section id="setup" class="setup" aria-labelledby="setupTitle">
    <p id="setupVersion" class="setup-ver mono" aria-live="polite"></p>
    <h2 id="setupTitle" class="page-title" tabindex="-1">设定这个世界</h2>

    <div class="setup-block">
      <h3 class="block-head">选一条要改的规则</h3>
      <div id="ruleCards" class="rule-cards" role="group" aria-label="选择规则"></div>
    </div>

    <div class="setup-block">
      <h3 class="block-head">四个参数</h3>
      <p id="paramNote" class="note"></p>
      <div id="paramToggles" class="switch-list" role="group" aria-label="规则参数"></div>
    </div>

    <div class="setup-block">
      <h3 class="block-head">三个世界假设</h3>
      <div id="assumeToggles" class="switch-list" role="group" aria-label="世界假设"></div>
      <p class="note">假设决定规则能改到长河的哪一段；关掉一条，对应的改写会落空。</p>
    </div>

    <button id="generateBtn" class="generate" type="button">生成这个世界 →</button>
    <p id="appError" class="error" role="alert" hidden></p>
  </section>

  <section id="chapter" class="chapter-page" aria-labelledby="chapterWorld" hidden>
    <div class="chapter-top">
      <div class="chapter-top-line">
        <h2 id="chapterWorld" class="chapter-world" tabindex="-1"></h2>
        <span id="chapterRun" class="chapter-run mono"></span>
        <button id="editAssumptions" class="line-btn" type="button">修改假设</button>
      </div>
      <p id="chapterSummary" class="chapter-summary mono"></p>
    </div>

    <header class="chapter-head">
      <p id="chapterNo" class="chapter-no mono"></p>
      <div class="chapter-title-line">
        <h3 id="chapterName" class="chapter-name"></h3>
        <span id="chapterSpan" class="chapter-span mono"></span>
      </div>
      <p id="chapterSubtitle" class="chapter-subtitle"></p>
      <p id="chapterIntro" class="chapter-intro"></p>
      <p id="chapterCount" class="chapter-count mono"></p>
    </header>

    <div id="chapterBody" class="chapter-body"></div>

    <nav class="chapter-nav" aria-label="章节导航">
      <button id="prevChapter" class="nav-btn" type="button">← 上一版</button>
      <div id="chapterDots" class="chapter-dots" role="group" aria-label="章节圆点"></div>
      <button id="nextChapter" class="nav-btn" type="button">下一版 →</button>
    </nav>
  </section>

</main>

<footer>
  <p id="disclaimer" class="disclaimer"></p>
  <p class="colophon mono"><span id="metaVersion"></span> · 报纸版式 B · 断网可玩</p>
</footer>

<noscript><p class="error">本页需要 JavaScript 才能推演世界。请启用后刷新。</p></noscript>

</body>
</html>
