<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生：无限分岔 · 从出生到死亡的文字人生模拟</title>
<meta name="description" content="六显性属性、隐性变量、宿命三层、内在声音、蝴蝶回响与人生复盘。零依赖、完全离线。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<!--
  life.html —— 《人生：无限分岔》呈现组负责（独立页面，不与 index.html 混改）
  配套：life_data.js（内容组） / life_engine.js（技术组） / data.js（仅取版本号与更新日志）
-->
<style>
:root {
  --bg: #0d0a1f; --bg2: #171233; --card: #1c163a; --line: #2c2456; --line2: #3b3170;
  --text: #efeaff; --muted: #b3a9d9; --dim: #8b80b5;
  --violet: #a78bfa; --magenta: #f471b5; --green: #34d399; --amber: #fbbf24; --sky: #38bdf8; --rose: #fb7185;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  min-height: 100vh; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(60% 45% at 18% 8%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(50% 40% at 85% 20%, rgba(244,113,181,.12), transparent 60%),
    radial-gradient(70% 55% at 50% 100%, rgba(56,189,248,.08), transparent 65%);
}
#stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
::selection { background: rgba(244,113,181,.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px; padding: 12px 20px;
  background: rgba(13,10,31,.82); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: .5px; cursor: pointer; background: none; border: none; color: var(--text); font-family: inherit; padding: 0; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: linear-gradient(135deg, var(--violet), var(--magenta)); box-shadow: 0 0 18px rgba(167,139,250,.45); }
.logo em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: 1.5px; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line2); background: var(--card); color: var(--text);
  border-radius: 12px; padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: border-color .2s, background .2s, transform .15s;
}
.btn:hover { border-color: var(--violet); background: #231b47; }
.btn.small { padding: 6px 12px; font-size: 12px; border-radius: 10px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.ver-chip { color: var(--green); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); font-weight: 700; letter-spacing: .5px; display: inline-flex; align-items: center; gap: 7px; }
.ver-chip:hover { border-color: var(--green); background: rgba(52,211,153,.16); }
.ver-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: verpulse 2.4s infinite; }
@keyframes verpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

#app { max-width: 760px; margin: 0 auto; padding: 86px 20px 60px; }

.lf-hero h1 { font-size: 34px; margin: 18px 0 6px; letter-spacing: 1px; }
.lf-slogan { color: var(--muted); font-size: 15px; margin: 0 0 26px; }
.lf-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
.lf-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.lf-card b { display: block; color: var(--violet); font-size: 14px; margin-bottom: 6px; }
.lf-card span { color: var(--muted); font-size: 13px; line-height: 1.65; }
.lf-btn {
  border: none; border-radius: 14px; cursor: pointer; font-family: inherit; font-weight: 700;
  background: linear-gradient(135deg, var(--violet), var(--magenta)); color: #fff;
  padding: 13px 26px; font-size: 15px; box-shadow: 0 10px 30px -10px rgba(244,113,181,.55);
  transition: transform .15s, box-shadow .2s;
}
.lf-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -10px rgba(244,113,181,.7); }
.lf-btn.big { padding: 15px 40px; font-size: 17px; }
.lf-btn.small { padding: 7px 14px; font-size: 12px; border-radius: 10px; }
.lf-btn.ghost { background: var(--card); border: 1px solid var(--line2); color: var(--muted); box-shadow: none; font-weight: 500; }
.lf-note { color: var(--dim); font-size: 12px; margin-top: 16px; }
.lf-dis { color: var(--dim); font-size: 12px; margin-top: 26px; border-top: 1px dashed var(--line); padding-top: 14px; }
.lf-resume { background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.35); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.lf-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.lf-stage { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
.lf-meta { color: var(--dim); font-size: 12px; }
.lf-panel { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.lf-attr { display: flex; flex-direction: column; gap: 5px; }
.lf-an { color: var(--dim); font-size: 11px; }
.lf-av { font-size: 18px; font-weight: 800; }
.lf-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.lf-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--magenta)); border-radius: 2px; }
.lf-hintline { color: var(--dim); font-size: 12px; margin: 10px 2px 0; }

.lf-scene { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-top: 16px; }
.lf-scene p, .lf-forced p, .lf-etext {
  margin: 0; font-family: Georgia, "Songti SC", "SimSun", serif;
  font-size: 16px; line-height: 1.95; color: #e6dffa; letter-spacing: .3px;
}
.lf-voice { border-left: 3px solid var(--magenta); background: rgba(244,113,181,.07); border-radius: 0 12px 12px 0; padding: 12px 16px; margin-top: 14px; }
.lf-vn { color: var(--magenta); font-size: 12px; font-weight: 700; }
.lf-voice p { margin: 6px 0 0; font-size: 15px; color: #f3d3e4; font-family: Georgia, "Songti SC", "SimSun", serif; }
.lf-ask { margin: 20px 2px 10px; font-size: 14px; font-weight: 700; color: var(--muted); }
.lf-keytag { color: var(--amber); border: 1px solid rgba(251,191,36,.45); background: rgba(251,191,36,.1); font-size: 11px; padding: 2px 9px; border-radius: 10px; margin-left: 6px; }
.lf-choices { display: flex; flex-direction: column; gap: 10px; }
.lf-choice {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--bg2); border: 1px solid var(--line2); border-radius: 14px;
  padding: 14px 16px; color: var(--text); font-size: 15px; cursor: pointer; font-family: inherit;
  transition: border-color .2s, background .2s, transform .15s;
}
.lf-choice:hover { border-color: var(--violet); background: #221a45; transform: translateX(3px); }
.lf-key { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--line); color: var(--violet); font-weight: 800; font-size: 13px; }
.lf-hint { display: block; color: var(--dim); font-size: 12px; margin-top: 5px; }
.lf-choice.locked { cursor: not-allowed; opacity: .55; border-style: dashed; }
.lf-choice.locked:hover { transform: none; border-color: var(--line2); background: var(--bg2); }
.lf-choice.locked s { color: var(--dim); }
.lf-lock { display: block; color: var(--amber); font-size: 12px; margin-top: 6px; opacity: .9; }
.lf-event { border: 1px solid rgba(251,191,36,.4); background: rgba(251,191,36,.07); border-radius: var(--radius); padding: 16px 18px; margin-top: 16px; }
.lf-en { color: var(--amber); font-size: 12px; font-weight: 800; letter-spacing: .5px; }
.lf-event p { margin: 8px 0 0; font-size: 15px; line-height: 1.8; color: #f0e3c0; }
.lf-fate { margin-top: 14px; border: 1px dashed rgba(244,113,181,.5); background: rgba(244,113,181,.08); color: var(--magenta); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; }
.lf-forced { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-top: 12px; }
.lf-cont { margin-top: 14px; border: 1px solid var(--line2); background: var(--bg2); color: var(--muted); border-radius: 12px; padding: 11px 22px; font-size: 14px; cursor: pointer; font-family: inherit; }
.lf-cont:hover { border-color: var(--magenta); color: var(--text); }

.lf-end { text-align: left; }
.lf-etype { display: inline-block; color: var(--magenta); border: 1px solid rgba(244,113,181,.45); background: rgba(244,113,181,.1); font-size: 12px; font-weight: 800; padding: 3px 12px; border-radius: 12px; }
.lf-end h2 { font-size: 28px; margin: 12px 0 14px; }
.lf-etext { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.lf-review { margin-top: 20px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.lf-review h3 { margin: 0 0 10px; font-size: 15px; color: var(--violet); }
.lf-review h3 + ol, .lf-review ol { margin: 0 0 16px; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.9; }
.lf-review ol b { color: var(--text); }
.lf-cf { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.8; border-left: 2px solid var(--line2); padding-left: 12px; }
.lf-cf b { color: var(--amber); }
.lf-eline { margin: 14px 0 0; color: var(--dim); font-size: 13px; font-family: Georgia, "Songti SC", "SimSun", serif; }
.lf-end .lf-panel { margin-top: 18px; }
.lf-endbtns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

.mask { position: fixed; inset: 0; background: rgba(8,5,20,.82); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
.modal { background: var(--bg2); border: 1px solid var(--line2); border-radius: var(--radius); padding: 26px; max-width: 600px; width: 100%; max-height: 84vh; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }
.modal h3 { margin: 0 0 12px; font-size: 19px; }
.modal h4 { margin: 18px 0 6px; font-size: 14px; color: var(--violet); }
.modal p, .modal li { color: var(--muted); font-size: 13px; line-height: 1.8; }
.modal ul { padding-left: 18px; margin: 6px 0; }
.cl-sub { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
.cl-list { position: relative; padding-left: 24px; max-height: 52vh; overflow-y: auto; }
.cl-list::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, var(--magenta), var(--violet), var(--line)); }
.cl-entry { position: relative; margin-bottom: 22px; }
.cl-dot { position: absolute; left: -24px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg2); border: 3px solid var(--magenta); }
.cl-entry.old .cl-dot { border-color: var(--line2); }
.cl-ver { font-size: 17px; font-weight: 800; }
.cl-date { font-size: 12px; color: var(--dim); margin-left: 8px; }
.cl-tag { font-size: 11px; padding: 2px 10px; border-radius: 10px; margin-left: 8px; font-weight: 700; }
.cl-tag-首发 { color: var(--magenta); background: rgba(244,113,181,.14); }
.cl-tag-新增 { color: var(--green); background: rgba(52,211,153,.14); }
.cl-tag-优化 { color: var(--sky); background: rgba(56,189,248,.14); }
.cl-tag-修复 { color: var(--amber); background: rgba(251,191,36,.14); }
.cl-tag-变更 { color: var(--violet); background: rgba(167,139,250,.14); }
.cl-cur { font-size: 12px; color: var(--green); border: 1px solid rgba(52,211,153,.4); background: rgba(52,211,153,.1); padding: 2px 10px; border-radius: 12px; }
.cl-items { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: #d8d2f0; }
.cl-items li { margin-bottom: 6px; }

@media (max-width: 760px) {
  #app { padding: 78px 14px 46px; }
  .lf-hero h1 { font-size: 27px; }
  .lf-cards { grid-template-columns: 1fr; }
  .lf-panel { grid-template-columns: repeat(3, 1fr); row-gap: 12px; }
  .lf-scene p, .lf-forced p, .lf-etext { font-size: 15px; }
  .logo em { display: none; }
  .lf-end h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .ver-dot { animation: none !important; }
  .lf-choice, .lf-btn { transition: none !important; }
}
@media (max-width: 420px) {
  .topbar { gap: 6px; padding: 10px 12px; }
  .logo { font-size: 14px; white-space: nowrap; }
  .btn.small { padding: 6px 9px; white-space: nowrap; }
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="topbar">
  <button class="logo" onclick="L.renderStart()" title="回到入口">
    <span class="logo-mark">∞</span>人生：无限分岔 <em>LIFE · INFINITE FORKS</em>
  </button>
  <span class="spacer"></span>
  <a class="btn small" href="index.html" title="另一个玩法：平行人生模拟器">✦ 平行人生</a>
  <button class="btn small" onclick="L.help()">引擎规范</button>
  <button class="btn small ver-chip" onclick="L.changelog()" title="查看更新日志">
    <span class="ver-dot"></span><span id="verLabel">v2.0.0</span>
  </button>
</div>
<div id="app"></div>
<script src="data.js"></script>
<script src="life_data.js"></script>
<script src="life_engine.js"></script>
<script>
(function () {
  const cv = document.getElementById("stars");
  const cx = cv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], W = 0, H = 0;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.min(110, Math.floor(W * H / 16000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .3, p: Math.random() * Math.PI * 2, s: .4 + Math.random() * .8
    }));
  }
  function draw(t) {
    cx.clearRect(0, 0, W, H);
    for (const st of stars) {
      const a = reduced ? .5 : .25 + .45 * (0.5 + 0.5 * Math.sin(t / 1400 * st.s + st.p));
      cx.globalAlpha = a;
      cx.fillStyle = "#cfc4ff";
      cx.beginPath(); cx.arc(st.x, st.y, st.r, 0, 6.283); cx.fill();
    }
    cx.globalAlpha = 1;
    if (!reduced) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size);
  requestAnimationFrame(draw);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduced) requestAnimationFrame(draw); });
})();
</script>
</body>
</html>
